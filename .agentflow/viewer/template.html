<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; connect-src http://127.0.0.1:*;"
    />
    <title>Architecture</title>
    <link rel="icon" type="image/png" href="viewer/agentflow-favicon.png" />
    <style>
      :root {
        color: #202124;
        background: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --ink: #202124;
        --muted: #667085;
        --faint: #98a2b3;
        --line: #e4e7ec;
        --line-strong: #d0d5dd;
        --surface: #fff;
        --subtle: #f8f9fb;
        --hover: #f2f4f7;
        --selected: #eef4ff;
        --accent: #175cd3;
        --accent-strong: #1849a9;
        --green: #067647;
        --amber: #b54708;
        --red: #b42318;
        --rose: #c01048;
        --cyan: #0e7090;
        --teal: #107569;
        --orange: #b93815;
        --shadow: 0 10px 30px rgba(16, 24, 40, 0.12);
        letter-spacing: 0;
      }

      * { box-sizing: border-box; letter-spacing: 0; }
      [hidden] { display: none !important; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { min-width: 320px; }
      #app { width: 100%; height: 100%; }
      button, input, textarea { font: inherit; }
      button { color: inherit; cursor: pointer; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid #84adff;
        outline-offset: 2px;
      }
      code, pre, .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }

      .shell { display: grid; height: 100%; grid-template-rows: 56px minmax(0, 1fr); }
      .topbar {
        z-index: 40;
        display: grid;
        grid-template-columns: minmax(210px, 1fr) auto minmax(210px, 1fr);
        align-items: center;
        padding: 0 18px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: inline-flex;
        min-width: 0;
        align-items: center;
        gap: 10px;
        justify-self: start;
        padding: 4px;
        border: 0;
        background: transparent;
        text-align: left;
      }
      .brand img { width: 30px; height: 30px; object-fit: contain; }
      .brand-copy { display: flex; min-width: 0; flex-direction: column; }
      .brand-name { font-size: 13px; font-weight: 700; line-height: 1.2; }
      .project-name { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .primary-nav { display: flex; align-self: stretch; gap: 4px; }
      .nav-tab {
        position: relative;
        display: inline-flex;
        min-width: 100px;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 12px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }
      .nav-tab:hover { color: var(--ink); background: var(--subtle); }
      .nav-tab.is-active { color: var(--accent-strong); }
      .nav-tab.is-active::after { position: absolute; right: 12px; bottom: -1px; left: 12px; height: 2px; background: var(--accent); content: ""; }
      .count {
        display: inline-flex;
        min-width: 20px;
        height: 20px;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
        border-radius: 10px;
        background: var(--hover);
        color: var(--muted);
        font-size: 10px;
      }
      .nav-tab.is-active .count { background: #dbe8ff; color: var(--accent-strong); }
      .top-meta { display: flex; min-width: 0; align-items: center; justify-content: flex-end; gap: 8px; }
      .state-pill, .status-pill, .type-pill, .change-pill {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 7px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--subtle);
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        line-height: 1;
        text-transform: uppercase;
      }
      .state-pill.pending, .status-pill.changes_requested, .status-pill.draft { color: var(--amber); background: #fff8eb; border-color: #fedf89; }
      .status-pill.under_review { color: var(--accent-strong); background: #eff4ff; border-color: #b2ccff; }
      .status-pill.approved, .status-pill.resolved { color: var(--green); background: #ecfdf3; border-color: #abefc6; }
      .status-pill.stale { color: #b54708; background: #fff8eb; border-color: #fedf89; }
      .status-pill.rejected, .change-pill.removed { color: var(--red); background: #fef3f2; border-color: #fecdca; }
      .change-pill.added { color: var(--green); background: #ecfdf3; border-color: #abefc6; }
      .change-pill.modified { color: var(--amber); background: #fff8eb; border-color: #fedf89; }

      .workspace { min-height: 0; overflow: hidden; }
      .view { height: 100%; min-height: 0; }
      .empty { display: flex; min-height: 220px; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-align: center; }
      .icon-button, .button, .quiet-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: var(--surface);
        font-size: 12px;
        font-weight: 650;
      }
      .button { min-height: 34px; gap: 7px; padding: 0 12px; }
      .button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
      .button.primary:hover { background: var(--accent-strong); }
      .button.danger { color: var(--red); }
      .quiet-button { min-height: 30px; padding: 0 9px; border-color: transparent; background: transparent; color: var(--muted); }
      .quiet-button:hover, .icon-button:hover, .button:not(.primary):hover { background: var(--hover); color: var(--ink); }
      .icon-button { width: 32px; height: 32px; padding: 0; font-size: 16px; }
      .mobile-only { display: none; }

      .doc-list { border-top: 1px solid var(--line); background: var(--surface); }
      .doc-list-item { display: flex; width: 100%; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 15px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
      .doc-list-item:hover .list-title { color: var(--accent); }
      .list-copy { min-width: 0; }
      .list-title { display: block; overflow: hidden; font-size: 13px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
      .list-summary { display: -webkit-box; overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .list-meta { flex: 0 0 auto; color: var(--faint); font-size: 11px; }

      .architecture { display: grid; grid-template-columns: 276px minmax(0, 1fr) 302px; }
      .architecture.without-inspector { grid-template-columns: 276px minmax(0, 1fr); }
      .sidebar, .inspector { min-width: 0; min-height: 0; background: var(--surface); }
      .sidebar { display: flex; flex-direction: column; border-right: 1px solid var(--line); }
      .sidebar-head { padding: 15px 14px 13px; border-bottom: 1px solid var(--line); }
      .sidebar-title { margin: 0; font-size: 14px; font-weight: 700; line-height: 18px; }
      .sidebar-subtitle { margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 15px; }
      .search { position: relative; display: block; width: 100%; margin-top: 12px; }
      .search::before { position: absolute; z-index: 1; top: 10px; left: 10px; width: 10px; height: 10px; border: 1.5px solid var(--faint); border-radius: 50%; content: ""; pointer-events: none; }
      .search::after { position: absolute; z-index: 1; top: 21px; left: 20px; width: 5px; height: 1.5px; background: var(--faint); content: ""; pointer-events: none; transform: rotate(45deg); transform-origin: left center; }
      .search input { display: block; width: 100%; height: 34px; padding: 0 10px 0 32px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 12px; line-height: 34px; }
      .tree { min-height: 0; overflow: auto; padding: 10px 8px 24px; }
      .tree > .empty { min-height: 120px; padding: 16px; }
      .tree-row { display: flex; width: 100%; min-height: 32px; align-items: center; gap: 7px; padding: 5px 8px; border: 0; border-radius: 5px; background: transparent; text-align: left; }
      .tree-row:hover { background: var(--hover); }
      .tree-row.is-active { color: var(--accent-strong); background: var(--selected); }
      .tree-row.is-changed { box-shadow: inset 2px 0 var(--amber); }
      .tree-row.is-added { box-shadow: inset 2px 0 var(--green); }
      .tree-row.is-removed { color: var(--red); box-shadow: inset 2px 0 var(--red); }
      .tree-chevron { flex: 0 0 14px; color: var(--faint); font-size: 11px; text-align: center; }
      .tree-icon { display: inline-flex; flex: 0 0 22px; height: 18px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--muted); font-size: 8px; font-weight: 800; text-transform: uppercase; }
      .tree-icon.table { color: var(--green); background: #ecfdf3; border-color: #abefc6; }
      .tree-icon.flow { color: var(--accent-strong); background: #eff4ff; border-color: #b2ccff; }
      .tree-icon.document { color: var(--amber); background: #fff8eb; border-color: #fedf89; }
      .tree-label { min-width: 0; flex: 1; }
      .tree-name { display: block; overflow: hidden; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      .tree-kind { display: block; overflow: hidden; margin-top: 1px; color: var(--faint); font-size: 9px; text-overflow: ellipsis; text-transform: capitalize; white-space: nowrap; }
      .tree-children { margin-left: 12px; padding-left: 7px; border-left: 1px solid var(--line); }

      .document-main { display: grid; min-width: 0; min-height: 0; grid-template-rows: 50px minmax(0, 1fr); background: var(--surface); }
      .document-toolbar { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); }
      .page-heading { min-width: 0; }
      .page-heading-line { display: flex; min-width: 0; align-items: center; gap: 8px; }
      .page-heading h2 { overflow: hidden; margin: 0; font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .page-path { margin-top: 2px; color: var(--faint); font-size: 10px; }
      .toolbar-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 7px; }
      .segmented { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--subtle); }
      .segment { min-height: 27px; padding: 0 9px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 650; }
      .segment.is-active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08); }
      .page-surface { min-width: 0; min-height: 0; overflow: auto; }
      .page-empty { display: flex; height: 100%; align-items: center; justify-content: center; padding: 30px; text-align: center; }
      .page-empty h2 { margin: 0 0 6px; font-size: 16px; }
      .page-empty p { max-width: 420px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }

      .table-page, .article-page { width: min(1100px, calc(100% - 48px)); margin: 0 auto; padding: 34px 0 80px; }
      .content-intro { margin-bottom: 24px; }
      .content-intro h1 { margin: 0; font-size: 24px; line-height: 1.25; }
      .content-intro p { max-width: 760px; margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
      .data-table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 7px; }
      .data-table { width: 100%; min-width: 680px; border-collapse: collapse; table-layout: auto; }
      .data-table th { position: sticky; top: 0; z-index: 1; padding: 10px 12px; background: var(--subtle); color: var(--muted); font-size: 10px; font-weight: 750; text-align: left; text-transform: uppercase; }
      .data-table td { max-width: 360px; padding: 11px 12px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.4; vertical-align: top; overflow-wrap: anywhere; }
      .data-table tr { cursor: pointer; }
      .data-table tbody tr:hover { background: var(--subtle); }
      .data-table tr.is-selected { background: var(--selected); box-shadow: inset 3px 0 var(--accent); }
      .data-table tr.is-added { background: #f6fef9; box-shadow: inset 3px 0 var(--green); }
      .data-table tr.is-changed { background: #fffcf5; box-shadow: inset 3px 0 var(--amber); }
      .data-table tr.is-removed { color: var(--red); background: #fffafa; box-shadow: inset 3px 0 var(--red); }
      .data-table td.is-added { background: #f0fdf4; }
      .data-table td.is-changed { background: #fffaeb; }
      .data-table td.is-removed { background: #fef3f2; }
      .cell-code { color: #344054; font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .cell-badge { display: inline-block; padding: 2px 6px; border-radius: 3px; background: var(--hover); color: #475467; font-size: 10px; font-weight: 700; }
      .cell-reference { color: var(--cyan); }
      .cell-change { display: grid; gap: 5px; min-width: 110px; }
      .cell-change-value { display: grid; grid-template-columns: 28px minmax(0,1fr); align-items: baseline; gap: 6px; }
      .cell-change-label { color: var(--faint); font-size: 8px; font-weight: 800; text-transform: uppercase; }
      .cell-change-value.was .cell-change-content { color: var(--red); text-decoration: line-through; }
      .cell-change-value.now .cell-change-content { color: var(--green); font-weight: 650; }
      .row-change-pill { display: inline-flex; margin-left: 7px; padding: 2px 5px; border-radius: 3px; font-size: 8px; font-weight: 800; line-height: 1.2; text-transform: uppercase; vertical-align: middle; }
      .row-change-pill.added { color: var(--green); background: #dcfae6; }
      .row-change-pill.modified { color: var(--amber); background: #fef0c7; }
      .row-change-pill.removed { color: var(--red); background: #fee4e2; }
      .article-section { padding: 24px 0; border-top: 1px solid var(--line); }
      .article-section:first-of-type { border-top: 0; }
      .article-section h2 { margin: 0 0 14px; font-size: 17px; }
      .doc-block { margin: 12px 0; color: #344054; font-size: 13px; line-height: 1.65; }
      .doc-block ul { margin: 8px 0; padding-left: 22px; }
      .doc-block pre { overflow: auto; padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: #f8fafc; font-size: 11px; line-height: 1.55; }
      .callout { padding: 12px 14px; border-left: 3px solid var(--accent); background: #f5f8ff; }
      .callout.warning { border-color: var(--amber); background: #fffaf0; }
      .callout.success { border-color: var(--green); background: #f0fdf4; }
      .key-values { display: grid; grid-template-columns: minmax(120px, 0.35fr) 1fr; border-top: 1px solid var(--line); }
      .key-values dt, .key-values dd { margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
      .key-values dt { color: var(--muted); }

      .flow-page { position: relative; height: 100%; min-height: 0; overflow: hidden; background-color: #fbfcfd; background-image: radial-gradient(#d9dde5 0.7px, transparent 0.7px); background-size: 20px 20px; touch-action: none; cursor: grab; }
      .flow-page.is-panning { cursor: grabbing; }
      .flow-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
      .flow-edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
      .flow-edge { fill: none; stroke: #98a2b3; stroke-width: 1.6; marker-end: url(#arrow); pointer-events: stroke; }
      .flow-edge.async { stroke: var(--orange); stroke-dasharray: 6 5; }
      .flow-edge.error { stroke: var(--red); stroke-dasharray: 3 4; }
      .flow-edge.is-added { stroke: var(--green); stroke-width: 2.2; }
      .flow-edge.is-modified { stroke: var(--amber); stroke-width: 2.2; }
      .flow-edge.is-removed { stroke: var(--red); stroke-dasharray: 3 4; opacity: .72; }
      .flow-edge-hit { fill: none; stroke: transparent; stroke-width: 15; pointer-events: stroke; cursor: pointer; }
      .flow-edge.is-selected { stroke: var(--accent); stroke-width: 2.6; }
      .edge-label { fill: #667085; font-size: 10px; font-weight: 650; paint-order: stroke; stroke: #fbfcfd; stroke-width: 5px; stroke-linejoin: round; }
      .flow-group { position: absolute; border: 1px dashed #b9c0cc; border-radius: 8px; background: rgba(255,255,255,0.36); pointer-events: none; }
      .flow-group-label { position: absolute; top: -22px; left: 2px; color: var(--muted); font-size: 10px; font-weight: 700; }
      .flow-node {
        position: absolute;
        display: flex;
        width: 208px;
        min-height: 82px;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: 13px 15px;
        border: 1.5px solid var(--node-border, #98a2b3);
        border-radius: 6px;
        background: var(--node-bg, #fff);
        box-shadow: 0 1px 2px rgba(16,24,40,.08);
        text-align: left;
        cursor: pointer;
        user-select: none;
        overflow-wrap: anywhere;
      }
      .flow-node:hover { box-shadow: 0 3px 8px rgba(16,24,40,.12); }
      .flow-node.is-selected { outline: 3px solid rgba(23,92,211,.18); border-color: var(--accent); }
      .flow-node.is-added { --change-color: #12b76a; border-color: var(--change-color); box-shadow: 0 0 0 2px #abefc6; }
      .flow-node.is-changed { --change-color: #f79009; border-color: var(--change-color); box-shadow: 0 0 0 2px #fedf89; }
      .flow-node.is-removed { --change-color: #f04438; border-color: var(--change-color); opacity: .72; box-shadow: 0 0 0 2px #fecdca; }
      .flow-node[data-tone="stone"] { --node-bg: #f9fafb; --node-border: #98a2b3; }
      .flow-node[data-tone="blue"] { --node-bg: #eff4ff; --node-border: #84adff; }
      .flow-node[data-tone="cyan"] { --node-bg: #ecfdff; --node-border: #67e3f9; }
      .flow-node[data-tone="slate"] { --node-bg: #f8fafc; --node-border: #94a3b8; }
      .flow-node[data-tone="amber"] { --node-bg: #fffaeb; --node-border: #fdb022; }
      .flow-node[data-tone="green"] { --node-bg: #ecfdf3; --node-border: #6ce9a6; }
      .flow-node[data-tone="teal"] { --node-bg: #f0fdf9; --node-border: #5fe9d0; }
      .flow-node[data-tone="orange"] { --node-bg: #fff4ed; --node-border: #f7b27a; }
      .flow-node[data-tone="rose"] { --node-bg: #fff1f3; --node-border: #fda4af; }
      .flow-node[data-tone="red"] { --node-bg: #fef3f2; --node-border: #f97066; }
      .flow-node[data-shape="capsule"] { border-radius: 40px; align-items: center; text-align: center; }
      .flow-node[data-shape="window"]::before { position: absolute; top: 0; right: 0; left: 0; height: 10px; border-bottom: 1px solid var(--node-border); border-radius: 5px 5px 0 0; background: rgba(255,255,255,.5); content: ""; }
      .flow-node[data-shape="endpoint"] { border-left-width: 6px; }
      .flow-node[data-shape="job"] { border-style: dashed; border-left-width: 6px; }
      .flow-node[data-shape="diamond"] { isolation: isolate; width: 220px; min-height: 132px; padding: 30px 46px; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
      .flow-node[data-shape="diamond"]::before,
      .flow-node[data-shape="diamond"]::after { position: absolute; z-index: 0; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); content: ""; }
      .flow-node[data-shape="diamond"]::before { inset: 0; background: var(--node-border); }
      .flow-node[data-shape="diamond"]::after { inset: 2px; background: var(--node-bg); }
      .flow-node[data-shape="diamond"] > * { position: relative; z-index: 1; }
      .flow-node[data-shape="diamond"].is-selected { outline: 0; filter: drop-shadow(0 0 4px rgba(23,92,211,.42)); }
      .flow-node[data-shape="diamond"].is-added,
      .flow-node[data-shape="diamond"].is-changed,
      .flow-node[data-shape="diamond"].is-removed { filter: drop-shadow(0 0 4px var(--change-color)); }
      .flow-node[data-shape="diamond"].is-added::before,
      .flow-node[data-shape="diamond"].is-changed::before,
      .flow-node[data-shape="diamond"].is-removed::before { background: var(--change-color); }
      .flow-node[data-shape="database"] { border-radius: 48% 48% 10px 10px / 16px 16px 8px 8px; }
      .flow-node[data-shape="queue"] { clip-path: polygon(10% 0,100% 0,90% 100%,0 100%); }
      .flow-node[data-shape="event"] { border-radius: 50% 8px 50% 8px; }
      .flow-node[data-shape="cloud"] { border-style: dashed; border-radius: 25px; }
      .flow-node[data-shape="subprocess"] { box-shadow: inset 4px 0 var(--node-bg), inset 6px 0 var(--node-border), inset -4px 0 var(--node-bg), inset -6px 0 var(--node-border); }
      .node-meta { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
      .node-type { color: var(--muted); font-size: 8px; font-weight: 800; text-transform: uppercase; }
      .node-change { display: inline-flex; flex: 0 0 auto; padding: 2px 5px; border-radius: 3px; font-size: 8px; font-weight: 800; line-height: 1.15; text-transform: uppercase; }
      .node-change.added { color: #067647; background: #dcfae6; }
      .node-change.modified { color: #b54708; background: #fef0c7; }
      .node-change.removed { color: #b42318; background: #fee4e2; }
      .node-title { display: block; width: 100%; font-size: 12px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
      .node-subtitle { display: block; width: 100%; margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.4; overflow-wrap: anywhere; }

      .proposal-row:hover { background: var(--subtle); }

      .proposal-row-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

      .change-summary { display: grid; grid-template-columns: repeat(4,1fr); border: 1px solid var(--line); border-radius: 7px; }

      .change-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 12px; }
      .change-row code { color: var(--muted); font-size: 10px; }

      .comments-list { border: 1px solid var(--line); background: var(--surface); }
      .comment-row { display: grid; grid-template-columns: 110px minmax(180px,.65fr) minmax(260px,1.35fr) 110px; align-items: start; gap: 18px; padding: 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
      .comment-row:last-child { border-bottom: 0; }

      .comment-date { color: var(--faint); font-size: 10px; text-align: right; }
      .toast { position: fixed; z-index: 100; right: 18px; bottom: 18px; max-width: 360px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 7px; background: #101828; color: #fff; box-shadow: var(--shadow); font-size: 11px; line-height: 1.45; }

      @media (max-width: 1080px) {

      }
      @media (max-width: 760px) {

        .nav-tab { min-width: 0; flex: 1; font-size: 11px; }

        .architecture.without-inspector { grid-template-columns: 1fr; }

        .sidebar.is-open { transform: translateX(0); }
        .document-toolbar { padding: 0 8px; }
        .page-heading { display: none; }
        .segmented { max-width: calc(100vw - 92px); overflow: auto; }
        .segment { white-space: nowrap; }
        .table-page, .article-page { width: calc(100% - 24px); padding-top: 22px; }
