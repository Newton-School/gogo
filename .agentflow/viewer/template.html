        .proposal-list { border-right: 0; }
        .proposal-detail { padding: 22px 16px 32px; border-top: 1px solid var(--line); }
        .change-summary { grid-template-columns: repeat(2,1fr); }
        .change-stat:nth-child(2) { border-right: 0; }
        .change-stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
        .collection-header { align-items: flex-start; flex-direction: column; }
        .filters { max-width: 100%; overflow: auto; }
        .comment-row { grid-template-columns: 80px minmax(0,1fr); gap: 8px 12px; }
        .comment-row-message { grid-column: 1 / -1; }
        .comment-date { text-align: left; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" hidden></div>
    <script>
      "use strict";
      const DATA = __AGENTFLOW_REVIEW_DATA__;
      const app = document.getElementById("app");
      const toastElement = document.getElementById("toast");
      const projectKey = `agentflow:${DATA.project.projectId}`;
      const pageSearchCache = new WeakMap();
      const runtime = {
        selection: null,
        sidebarOpen: false,
        inspectorOpen: false,
        search: "",
        commentFilter: "open",
        proposalFilter: "review",
        collapsed: readStored(`${projectKey}:collapsed`, {}),
        sidebarScroll: {},
        flowViews: {},
        pendingComments: [],
      };

      function readStored(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch (_error) {
          return fallback;
        }
      }

      function store(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (_error) {}
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDate(value) {
        if (!value) return "";
        const date = new Date(value);
        return Number.isNaN(date.getTime())
          ? String(value)
          : new Intl.DateTimeFormat(undefined, { dateStyle: "medium" }).format(date);
      }

      function titleCase(value) {
        return String(value || "")
          .replaceAll("_", " ")
          .replaceAll("-", " ")
          .replace(/\b\w/g, (letter) => letter.toUpperCase());
      }

      function pagesMap(snapshot) {
        return Object.fromEntries((snapshot?.pages || []).map((page) => [page.id, page]));
      }

      function flattenNavigation(navigation, depth = 0, parentTitles = [], output = []) {
        for (const item of navigation?.items || []) {
          const path = [...parentTitles, item.title];
          output.push({ ...item, depth, path });
          if (item.type === "folder") flattenNavigation({ items: item.children }, depth + 1, path, output);
        }
        return output;
      }

      function proposalById(id) {
        return (DATA.proposals || []).find((proposal) => proposal.id === id) || null;
      }

      function activeOpenComments() {
        return allComments().filter((comment) => comment.status === "open");
      }

      function allComments() {
        return [...(DATA.comments || []), ...runtime.pendingComments];
      }

      function routeFromHash() {
        const raw = location.hash.replace(/^#/, "") || "architecture";
        const [path, queryString = ""] = raw.split("?", 2);
        const parts = path.split("/").filter(Boolean).map(decodeURIComponent);
        const query = new URLSearchParams(queryString);
        if (parts[0] === "architecture") {
          return {
            view: "architecture",
            pageId: parts[1] || null,
            target: query.get("target"),
          };
        }
        if (parts[0] === "review") {
          return {
            view: "review",
            proposalId: parts[1] || DATA.proposal?.id || DATA.proposals?.[0]?.id || null,
            pageId: parts[2] || null,
            mode: ["proposed", "before"].includes(query.get("mode")) ? query.get("mode") : "changes",
            target: query.get("target"),
          };
        }
        if (parts[0] === "comments") return { view: "comments", status: query.get("status") || "open" };
        return { view: "architecture", pageId: null, target: null };
      }

      function navigate(path) {
        if (location.hash === `#${path}`) renderApp();
        else location.hash = path;
      }

      function architecturePageRoute(pageId, target = null) {
        const query = new URLSearchParams();
        if (target) query.set("target", target);
        const suffix = query.size ? `?${query}` : "";
        return `architecture/${encodeURIComponent(pageId || "")}${suffix}`;
      }

      function reviewPageRoute(proposalId, pageId, mode = "changes", target = null) {
        const query = new URLSearchParams({ mode });
        if (target) query.set("target", target);
        return `review/${encodeURIComponent(proposalId || "")}/${encodeURIComponent(pageId || "")}?${query}`;
      }

      function contextPageRoute(context, pageId = context.pageId, target = null) {
        return context.scope === "review"
          ? reviewPageRoute(context.bundle?.proposal?.id, pageId, context.mode, target)
          : architecturePageRoute(pageId, target);
      }

      function showToast(message) {
        toastElement.textContent = message;
        toastElement.hidden = false;
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => { toastElement.hidden = true; }, 3200);
      }

      function statusLabel(status) {
        return titleCase(status || "draft");
      }

      function statusPill(status) {
        return `<span class="status-pill ${escapeHtml(status)}">${escapeHtml(statusLabel(status))}</span>`;
      }

      function topbar(route) {
        const openCount = activeOpenComments().length;
        const activeProposals = (DATA.proposals || []).filter((item) => ["under_review", "changes_requested"].includes(item.status)).length;
        const pending = DATA.state.implementedArchitectureHash !== DATA.architectureHash;
        return `
          <header class="topbar">
            <button class="brand" data-action="navigate" data-path="architecture" title="Open architecture">
              <img src="viewer/agentflow-mark.png" alt="" />
              <span class="brand-copy">
                <span class="brand-name">AgentFlow</span>
                <span class="project-name">${escapeHtml(DATA.project.name)}</span>
              </span>
            </button>
            <nav class="primary-nav" aria-label="AgentFlow sections">
              ${navTab("architecture", "Architecture", route.view, "")}
              ${navTab("review", "Review", route.view, activeProposals)}
              ${navTab("comments", "Comments", route.view, openCount)}
            </nav>
            <div class="top-meta">
              <span class="state-pill ${pending ? "pending" : ""}">${pending ? "Implementation pending" : "Architecture current"}</span>
            </div>
          </header>`;
      }

      function navTab(path, label, activeView, count) {
        return `<button class="nav-tab ${activeView === path ? "is-active" : ""}" data-action="navigate" data-path="${path}">
          <span>${label}</span>${count === "" ? "" : `<span class="count">${count}</span>`}
        </button>`;
      }

      function renderApp() {
        saveSidebarScroll();
        const route = routeFromHash();
        runtime.commentFilter = route.status || runtime.commentFilter;
        const sectionTitle = route.view === "review" ? "Review" : route.view === "comments" ? "Comments" : "Architecture";
        document.title = `${DATA.project.name} · ${sectionTitle}`;
        app.innerHTML = `<div class="shell">${topbar(route)}<main class="workspace">${renderView(route)}</main></div>`;
        restoreSidebarScroll();
        bindView(route);
      }

      function renderView(route) {
        if (route.view === "architecture") return renderArchitecture(route);
        if (route.view === "review") return renderReview(route);
        if (route.view === "comments") return renderComments(route);
        return renderArchitecture({ view: "architecture", pageId: null, target: null });
      }

      function emptyList(message) {
        return `<div class="empty">${escapeHtml(message)}</div>`;
      }

      function reviewBundle(proposalId) {
        return DATA.proposalReviews?.[proposalId] || (
          DATA.proposal?.id === proposalId
            ? { proposal: DATA.proposal, review: DATA.review, before: DATA.before, proposed: DATA.proposed, diff: DATA.diff }
            : null
        );
      }

      function architectureContext(route) {
        return pageContext({ ...route, scope: "architecture", mode: "existing" }, DATA.implemented, DATA.implemented, { navigation: {}, pages: {} }, null);
      }

      function reviewContext(route) {
        const bundle = reviewBundle(route.proposalId);
        if (!bundle || bundle.recordOnly) return null;
        const mode = ["proposed", "before"].includes(route.mode) ? route.mode : "changes";
        const snapshot = mode === "before" ? bundle.before : bundle.proposed;
        const diff = mode === "changes" ? bundle.diff : { navigation: {}, pages: {} };
        return pageContext({ ...route, scope: "review", mode }, snapshot, bundle.before, diff, bundle);
      }

      function pageContext(route, snapshot, before, diff, bundle) {
        const pageMap = pagesMap(snapshot);
        const beforeMap = pagesMap(before);
        const navigationPages = flattenNavigation(snapshot.navigation).filter((item) => item.type === "page");
        const firstPage = navigationPages[0]?.pageId || Object.keys(pageMap)[0] || null;
        const requestedPageExists = route.pageId && (
          pageMap[route.pageId]
          || beforeMap[route.pageId]
          || pagesMap(bundle?.proposed)[route.pageId]
        );
        const pageId = requestedPageExists ? route.pageId : firstPage;
        const page = pageMap[pageId] || beforeMap[pageId] || null;
        return { ...route, bundle, snapshot, before, diff, pageMap, beforeMap, pageId, page };
      }

      function renderArchitecture(route) {
        const context = architectureContext(route);
        return renderArchitectureWorkspace(context);
      }

      function renderReview(route) {
        if (!route.pageId) return renderReviewCollection(route);
        const context = reviewContext(route);
        return context ? renderArchitectureWorkspace(context) : renderReviewCollection(route);
      }

      function renderArchitectureWorkspace(context) {
        const selection = selectionFromRoute(context);
        const isReview = context.scope === "review";
        const isDocument = context.page?.type === "document";
        return `<section class="view architecture ${isDocument ? "without-inspector" : ""}">
          <aside class="sidebar ${runtime.sidebarOpen ? "is-open" : ""}" id="architecture-sidebar" data-scroll-key="${escapeHtml(sidebarScrollKey(context))}">
            <div class="sidebar-head">
              <h2 class="sidebar-title">${isReview ? "Review changes" : "Architecture"}</h2>
              <div class="sidebar-subtitle">${isReview ? escapeHtml(context.bundle.proposal.title) : `${context.snapshot.pages.length} pages · client-defined order`}</div>
              <label class="search"><input id="architecture-search" type="search" value="${escapeHtml(runtime.search)}" placeholder="${isReview ? "Search changes" : "Search architecture"}" autocomplete="off" /></label>
            </div>
            <nav class="tree" id="architecture-tree" aria-label="${isReview ? "Proposal pages" : "Architecture pages"}">${renderTree(context)}</nav>
          </aside>
          <section class="document-main">
            ${renderDocumentToolbar(context)}
            <div class="page-surface" id="page-surface">${renderPage(context, selection)}</div>
          </section>
          ${isDocument ? "" : renderInspector(context, selection)}
        </section>`;
      }

      function sidebarScrollKey(context) {
        return context.scope === "review"
          ? `review:${context.bundle?.proposal?.id || ""}`
          : "architecture";
      }

      function saveSidebarScroll() {
        const sidebar = document.getElementById("architecture-sidebar");
        const key = sidebar?.dataset.scrollKey;
        if (key) runtime.sidebarScroll[key] = sidebar.scrollTop;
      }

      function restoreSidebarScroll() {
        const sidebar = document.getElementById("architecture-sidebar");
        const key = sidebar?.dataset.scrollKey;
        if (key) sidebar.scrollTop = runtime.sidebarScroll[key] || 0;
      }

      function selectionFromRoute(context) {
        if (!context.page) return null;
        if (context.page.type === "document") return { type: "page", id: context.page.id };
        const target = context.target || "page";
        const separator = target.indexOf(":");
        return separator < 0
          ? { type: "page", id: context.page.id }
          : { type: target.slice(0, separator), id: target.slice(separator + 1) };
      }

      function navigationItemMatches(item, pageMap, query) {
        const page = pageMap[item.pageId];
        const searchable = page
          ? `${item.title} ${item.pageId || ""} ${searchablePage(page)}`
          : item.title;
        return searchable.toLowerCase().includes(query);
      }

      function searchablePage(page) {
        if (!pageSearchCache.has(page)) pageSearchCache.set(page, JSON.stringify(page).toLowerCase());
        return pageSearchCache.get(page);
      }

      function navigationMatches(item, pageMap, query) {
        return navigationItemMatches(item, pageMap, query)
          || (item.children || []).some((child) => navigationMatches(child, pageMap, query));
      }

      function hasChange(status) {
        return Boolean(status && status !== "unchanged");
      }

      function affectedReviewItems(items, diff) {
        return items.reduce((visible, item) => {
          if (item.type === "page") {
            const pageStatus = diff.pages?.[item.pageId]?.status;
            const navigationStatus = diff.navigation?.[item.id];
            if (hasChange(pageStatus) || hasChange(navigationStatus)) visible.push(item);
            return visible;
          }

          const children = affectedReviewItems(item.children || [], diff);
          if (children.length || hasChange(diff.navigation?.[item.id])) {
            visible.push({ ...item, children });
          }
          return visible;
        }, []);
      }

      function renderTree(context) {
        const query = runtime.search.trim().toLowerCase();
        const allItems = context.snapshot.navigation.items || [];
        const items = context.scope === "review"
          ? affectedReviewItems(allItems, context.bundle?.diff || context.diff)
          : allItems;
        const visible = query ? items.filter((item) => navigationMatches(item, context.pageMap, query)) : items;
        let html = visible.map((item) => renderTreeItem(item, context, query, 0)).join("");
        if (context.scope === "review" && context.mode === "changes") {
          const removed = Object.entries(context.diff.pages || {})
            .filter(([, change]) => change.status === "removed")
            .map(([pageId]) => context.beforeMap[pageId])
            .filter((page) => page && (!query || `${page.title} ${page.id} ${searchablePage(page)}`.toLowerCase().includes(query)));
          if (removed.length) {
            html += `<div style="margin-top:12px;padding:8px 8px 4px;color:var(--faint);font-size:9px;font-weight:750;text-transform:uppercase">Removed</div>`;
            html += removed.map((page) => renderPageTreeRow(page.title, page.id, page.type, context, "removed", 0)).join("");
          }
        }
        return html || `<div class="empty">No matching pages.</div>`;
      }

      function renderTreeItem(item, context, query, depth) {
        if (item.type === "page") {
          const page = context.pageMap[item.pageId];
          if (!page) return "";
          const status = context.diff.pages?.[page.id]?.status || context.diff.navigation?.[item.id] || "unchanged";
          return renderPageTreeRow(item.title, page.id, page.type, context, status, depth);
        }
        const collapsed = query ? false : runtime.collapsed[item.id] === true;
        const ownMatch = query && navigationItemMatches(item, context.pageMap, query);
        const childItems = query && !ownMatch
          ? (item.children || []).filter((child) => navigationMatches(child, context.pageMap, query))
          : (item.children || []);
        const children = collapsed ? "" : childItems.map((child) => renderTreeItem(child, context, query, depth + 1)).join("");
        const status = context.diff.navigation?.[item.id] || "unchanged";
        return `<div class="tree-branch">
          <button class="tree-row ${statusClass(status)}" data-action="toggle-folder" data-folder-id="${escapeHtml(item.id)}" style="padding-left:${8 + depth * 8}px">
            <span class="tree-chevron">${collapsed ? "▸" : "▾"}</span><span class="tree-icon">§</span><span class="tree-label"><span class="tree-name">${escapeHtml(item.title)}</span></span>
          </button>
          ${collapsed ? "" : `<div class="tree-children">${children}</div>`}
        </div>`;
      }

      function renderPageTreeRow(title, pageId, type, context, status, depth) {
        const active = context.pageId === pageId;
        const path = contextPageRoute(context, pageId);
        return `<button class="tree-row ${active ? "is-active" : ""} ${statusClass(status)}" data-action="navigate" data-path="${escapeHtml(path)}" style="padding-left:${8 + depth * 8}px">
          <span class="tree-chevron"></span><span class="tree-icon ${escapeHtml(type)}">${type === "table" ? "T" : type === "flow" ? "F" : "D"}</span>
          <span class="tree-label"><span class="tree-name">${escapeHtml(title)}</span><span class="tree-kind">${escapeHtml(type)}</span></span>
        </button>`;
      }

      function statusClass(status) {
        if (status === "added") return "is-added";
        if (status === "modified") return "is-changed";
        if (status === "removed") return "is-removed";
        return "";
      }

      function renderDocumentToolbar(context) {
        const pageChange = context.page ? context.diff.pages?.[context.page.id]?.status : null;
        const isReview = context.scope === "review";
        return `<header class="document-toolbar">
          <div style="display:flex;align-items:center;gap:8px;min-width:0">
            <button class="icon-button mobile-only" data-action="toggle-sidebar" title="Open architecture navigation">☰</button>
            ${isReview ? `<button class="icon-button" data-action="navigate" data-path="review/${encodeURIComponent(context.bundle.proposal.id)}" title="Back to review">←</button>` : ""}
            <div class="page-heading">
              <div class="page-heading-line"><h2>${escapeHtml(context.page?.title || "Architecture")}</h2>${context.page ? `<span class="type-pill">${escapeHtml(context.page.type)}</span>` : ""}${pageChange && pageChange !== "unchanged" ? `<span class="change-pill ${pageChange}">${pageChange}</span>` : ""}</div>
              <div class="page-path">${escapeHtml(isReview ? context.bundle.proposal.title : "Existing architecture")}</div>
            </div>
          </div>
          <div class="toolbar-actions">
            ${isReview ? `<div class="segmented" aria-label="Review comparison">${reviewModeButton(context, "changes", "Changes")}${reviewModeButton(context, "proposed", "Proposed")}${reviewModeButton(context, "before", "Before")}</div>` : ""}
            ${context.page?.type === "document" ? "" : `<button class="icon-button mobile-only" data-action="toggle-inspector" title="Open details">ⓘ</button>`}
          </div>
        </header>`;
      }

      function reviewModeButton(context, mode, label) {
        const path = reviewPageRoute(context.bundle.proposal.id, context.pageId, mode);
        return `<button class="segment ${context.mode === mode ? "is-active" : ""}" data-action="navigate" data-path="${escapeHtml(path)}">${label}</button>`;
      }

      function renderPage(context, selection) {
        const page = context.page;
        if (!page) {
          const beforeMissing = context.scope === "review" && context.mode === "before" && context.pageId;
          return `<div class="page-empty"><div><h2>${beforeMissing ? "Not present before this proposal" : "No architecture pages"}</h2><p>${beforeMissing ? "Switch to Changes to inspect the page added by this proposal." : "The agent will add the first table, flow, or document page through an architecture proposal."}</p></div></div>`;
        }
        if (page.type === "table") return renderTablePage(page, context, selection);
        if (page.type === "flow") return `<div class="flow-page" id="flow-canvas" data-page-id="${escapeHtml(page.id)}"><div class="flow-world" id="flow-world"></div>${flowControls()}</div>`;
        return renderDocumentPage(page, context);
      }

      function renderContentIntro(page) {
        return `<header class="content-intro"><h1>${escapeHtml(page.title)}</h1>${page.summary ? `<p>${escapeHtml(page.summary)}</p>` : ""}</header>`;
      }

      function renderTablePage(page, context, selection) {
        const elementChanges = context.diff.pages?.[page.id]?.elements || {};
        const table = tableReviewData(page, context);
        return `<article class="table-page">${renderContentIntro(page)}
          <div class="data-table-wrap"><table class="data-table"><thead><tr>
            ${table.columns.map(({ column }) => `<th data-action="select-element" data-type="column" data-id="${escapeHtml(column.id)}">${escapeHtml(column.label)}</th>`).join("")}
          </tr></thead><tbody>
            ${table.rows.map((rowRecord) => {
              const rowId = rowRecord.row.id;
              const rowChange = tableRowChange(rowId, table.columns, elementChanges);
              return `<tr class="${selection?.type === "row" && selection.id === rowId ? "is-selected" : ""} ${statusClass(rowChange)}" data-action="select-element" data-type="row" data-id="${escapeHtml(rowId)}">
                ${table.columns.map((columnRecord, index) => {
                  const cellId = `${rowId}.${columnRecord.column.id}`;
                  const cellChange = elementChanges[`cell:${cellId}`] || "unchanged";
                  const marker = index === 0 ? renderRowChangePill(rowChange) : "";
                  return `<td class="${selection?.type === "cell" && selection.id === cellId ? "is-selected" : ""} ${statusClass(cellChange)}" data-action="select-element" data-type="cell" data-id="${escapeHtml(cellId)}">${renderTableCell(rowRecord, columnRecord, cellChange, rowChange)}${marker}</td>`;
                }).join("")}
              </tr>`;
            }).join("")}
          </tbody></table></div>
        </article>`;
      }

      function tableReviewData(page, context) {
        const isDiff = context.scope === "review" && context.mode === "changes";
        const beforePage = isDiff ? context.beforeMap[page.id] || null : null;
        const afterPage = isDiff ? context.pageMap[page.id] || null : page;
        const beforeColumns = Object.fromEntries((beforePage?.columns || []).map((column) => [column.id, column]));
        const afterColumns = Object.fromEntries((afterPage?.columns || []).map((column) => [column.id, column]));
        const columnIds = [
          ...(afterPage?.columns || []).map((column) => column.id),
          ...(beforePage?.columns || []).map((column) => column.id).filter((id) => !afterColumns[id]),
        ];
        const beforeRows = Object.fromEntries((beforePage?.rows || []).map((row) => [row.id, row]));
        const afterRows = Object.fromEntries((afterPage?.rows || []).map((row) => [row.id, row]));
        const rowIds = [
          ...(afterPage?.rows || []).map((row) => row.id),
          ...(beforePage?.rows || []).map((row) => row.id).filter((id) => !afterRows[id]),
        ];
        return {
          columns: columnIds.map((id) => ({ column: afterColumns[id] || beforeColumns[id], before: beforeColumns[id], after: afterColumns[id] })),
          rows: rowIds.map((id) => ({ row: afterRows[id] || beforeRows[id], before: beforeRows[id], after: afterRows[id] })),
        };
      }

      function tableRowChange(rowId, columns, changes) {
        const direct = changes[`row:${rowId}`] || "unchanged";
        if (direct !== "unchanged") return direct;
        const cellChanges = columns.map(({ column }) => changes[`cell:${rowId}.${column.id}`] || "unchanged");
        return cellChanges.some((status) => status !== "unchanged") ? "modified" : "unchanged";
      }

      function renderTableCell(rowRecord, columnRecord, cellChange, rowChange) {
        const columnId = columnRecord.column.id;
        const format = (columnRecord.after || columnRecord.before || columnRecord.column).format;
        const beforeValue = rowRecord.before?.cells?.[columnId];
        const afterValue = rowRecord.after?.cells?.[columnId];
        if (cellChange === "modified") {
          return `<div class="cell-change">${renderChangedCellValue("Was", beforeValue, format, "was")}${renderChangedCellValue("Now", afterValue, format, "now")}</div>`;
        }
        if (cellChange === "added" && rowChange !== "added") {
          return `<div class="cell-change">${renderChangedCellValue("Now", afterValue, format, "now")}</div>`;
        }
        if (cellChange === "removed" && rowChange !== "removed") {
          return `<div class="cell-change">${renderChangedCellValue("Was", beforeValue, format, "was")}</div>`;
        }
        return renderCell(rowRecord.after ? afterValue : beforeValue, format);
      }

      function renderChangedCellValue(label, value, format, state) {
        const display = value === undefined ? "Not set" : value === null ? "null" : value === "" ? "Empty" : value;
        return `<div class="cell-change-value ${state}"><span class="cell-change-label">${label}</span><span class="cell-change-content">${renderCell(display, format)}</span></div>`;
      }

      function renderRowChangePill(status) {
        if (!["added", "modified", "removed"].includes(status)) return "";
        const label = status === "modified" ? "Changed" : titleCase(status);
        return `<span class="row-change-pill ${status}">${label}</span>`;
      }

      function renderCell(value, format = "text") {
        const display = Array.isArray(value) ? value.join(", ") : value === true ? "Yes" : value === false ? "No" : value ?? "";
        const className = format === "code" ? "cell-code" : format === "badge" ? "cell-badge" : format === "reference" ? "cell-reference" : "";
        return `<span class="${className}">${escapeHtml(display)}</span>`;
      }

      function renderDocumentPage(page, context) {
        const changes = context.diff.pages?.[page.id]?.elements || {};
        return `<article class="article-page">${renderContentIntro(page)}${page.sections.map((section) => `
          <section class="article-section ${statusClass(changes[`section:${section.id}`])}">
            <h2>${escapeHtml(section.title)}</h2>
            ${section.blocks.map((block) => renderDocumentBlock(block, changes[`block:${block.id}`])).join("")}
          </section>`).join("")}</article>`;
      }

      function renderDocumentBlock(block, change) {
        let content = "";
        if (block.type === "paragraph") content = `<p>${escapeHtml(block.text)}</p>`;
        else if (block.type === "list") content = `<ul>${block.items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
        else if (block.type === "callout") content = `<div class="callout ${escapeHtml(block.tone || "note")}">${escapeHtml(block.text)}</div>`;
        else if (block.type === "code") content = `<pre><code>${escapeHtml(block.text)}</code></pre>`;
        else content = `<dl class="key-values">${block.values.map((item) => `<dt>${escapeHtml(item.label)}</dt><dd>${escapeHtml(item.value)}</dd>`).join("")}</dl>`;
        return `<div class="doc-block ${statusClass(change)}">${content}</div>`;
      }

      function flowControls() {
        return `<div class="flow-controls"><button class="icon-button" data-action="flow-zoom-out" title="Zoom out">−</button><span class="zoom-value" id="zoom-value">100%</span><button class="icon-button" data-action="flow-zoom-in" title="Zoom in">+</button><button class="button" data-action="flow-fit">Fit</button></div>`;
      }

      function selectedRecord(page, selection) {
        if (!page || !selection || selection.type === "page") return { type: "page", value: page, title: page?.title || "Architecture" };
        if (selection.type === "column") {
          const value = page.columns?.find((item) => item.id === selection.id);
          return { type: "column", value, title: value?.label || "Column" };
        }
        if (selection.type === "row") {
          const value = page.rows?.find((item) => item.id === selection.id);
          const first = page.columns?.[0];
          return { type: "row", value, title: value?.cells?.[first?.id] || "Table row" };
        }
        if (selection.type === "cell") {
          const separator = selection.id.lastIndexOf(".");
          const rowId = selection.id.slice(0, separator);
          const columnId = selection.id.slice(separator + 1);
          const row = page.rows?.find((item) => item.id === rowId);
          const column = page.columns?.find((item) => item.id === columnId);
          return { type: "cell", value: { row, column, cell: row?.cells?.[columnId] }, title: column?.label || "Table cell" };
        }
        if (selection.type === "node") {
          const value = page.nodes?.find((item) => item.id === selection.id);
          return { type: "node", value, title: value?.title || "Flow node" };
        }
        if (selection.type === "edge") {
          const value = page.edges?.find((item) => item.id === selection.id);
          return { type: "edge", value, title: value?.label || "Flow connection" };
        }
        if (selection.type === "group") {
          const value = page.groups?.find((item) => item.id === selection.id);
          return { type: "group", value, title: value?.title || "Flow group" };
        }
        if (selection.type === "section") {
          const value = page.sections?.find((item) => item.id === selection.id);
          return { type: "section", value, title: value?.title || "Section" };
        }
        if (selection.type === "block") {
          const value = page.sections?.flatMap((item) => item.blocks).find((item) => item.id === selection.id);
          return { type: "block", value, title: titleCase(value?.type || "Block") };
        }
        return { type: "page", value: page, title: page.title };
      }

      function commentTarget(context, selection) {
        if (!context.page) return null;
        const target = { kind: "page", pageId: context.page.id };
        if (selection && selection.type !== "page") {
          target.elementType = selection.type;
          target.elementId = selection.id;
        }
        return target;
      }

      function sameTarget(left, right) {
        return left?.kind === right?.kind
          && left?.pageId === right?.pageId
          && left?.navigationId === right?.navigationId
          && left?.elementType === right?.elementType
          && left?.elementId === right?.elementId;
      }

      function renderInspector(context, selection) {
        const record = selectedRecord(displayPage(context), selection);
        const target = commentTarget(context, selection);
        const proposalId = context.bundle?.proposal?.id;
        const comments = allComments().filter((comment) => comment.proposalId === proposalId && sameTarget(comment.target, target));
        const details = inspectorDetails(context, record, selection);
        const isChangeReview = context.scope === "review" && context.mode === "changes";
        const canComment = isChangeReview
          && context.bundle
          && ["under_review", "changes_requested"].includes(context.bundle.review?.status);
        return `<aside class="inspector ${runtime.inspectorOpen ? "is-open" : ""}" id="architecture-inspector">
          <div class="inspector-head">
            <div style="display:flex;justify-content:space-between;gap:8px"><span class="inspector-kicker">${escapeHtml(record.type)}</span><button class="quiet-button mobile-only" data-action="toggle-inspector">Close</button></div>
            <h2 class="inspector-title">${escapeHtml(record.title)}</h2>
            ${record.value?.description || (record.type === "page" && context.page?.summary) ? `<p class="inspector-summary">${escapeHtml(record.value?.description || context.page.summary)}</p>` : ""}
          </div>
          <div class="inspector-body">
            ${details.length ? `<section class="inspector-section"><h3>Technical details</h3><dl class="detail-list">${details.map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`).join("")}</dl></section>` : ""}
            ${isChangeReview ? `<section class="inspector-section"><h3>Comments${comments.length ? ` · ${comments.length}` : ""}</h3>${comments.length ? comments.map(renderInspectorComment).join("") : `<p class="writer-note">No comments on this item.</p>`}</section>` : ""}
            ${canComment ? renderCommentForm(context, target) : isChangeReview && !DATA.commentBridge ? `<section class="inspector-section"><h3>Add comment</h3><p class="writer-note">Regenerate with <span class="mono">make agentflow</span> to enable direct comments.</p></section>` : ""}
          </div>
        </aside>`;
      }

      function inspectorDetails(context, record, selection) {
        const page = displayPage(context);
        if (!record.value) return [];
        const value = record.value;
        if (record.type === "page") {
          const counts = page.type === "table" ? [["Rows", page.rows.length], ["Columns", page.columns.length]]
            : page.type === "flow" ? [["Nodes", page.nodes.length], ["Connections", page.edges.length]]
            : [["Sections", page.sections.length], ["Blocks", page.sections.reduce((sum, section) => sum + section.blocks.length, 0)]];
          return [["Page type", titleCase(page.type)], ...counts, ...(page.details || []).map((item) => [item.label, item.value])];
        }
        if (record.type === "column") return [["Format", titleCase(value.format || "text")], ...(value.description ? [["Description", value.description]] : [])];
        if (record.type === "row") return page.columns.map((column) => [column.label, displayValue(value.cells?.[column.id])]);
        if (record.type === "cell") {
          const separator = selection.id.lastIndexOf(".");
          const rowId = selection.id.slice(0, separator);
          const columnId = selection.id.slice(separator + 1);
          const beforePage = context.beforeMap[context.page.id];
          const afterPage = context.pageMap[context.page.id];
          const beforeRow = beforePage?.rows?.find((item) => item.id === rowId);
          const afterRow = afterPage?.rows?.find((item) => item.id === rowId);
          const column = afterPage?.columns?.find((item) => item.id === columnId) || beforePage?.columns?.find((item) => item.id === columnId);
          const cellStatus = context.diff.pages?.[context.page.id]?.elements?.[`cell:${selection.id}`];
          const changed = context.scope === "review" && context.mode === "changes"
            && ["added", "modified", "removed"].includes(cellStatus);
          return changed
            ? [["Column", column?.label || columnId], ["Before", displayValue(beforeRow?.cells?.[columnId])], ["Proposed", displayValue(afterRow?.cells?.[columnId])]]
            : [["Column", column?.label || value.column?.label || ""], ["Value", displayValue(value.cell)]];
        }
        if (record.type === "node") return [["Node type", DATA.nodeTypes[value.type]?.label || titleCase(value.type)], ...(value.subtitle ? [["Label", value.subtitle]] : []), ...(value.details || []).map((item) => [item.label, item.value])];
        if (record.type === "edge") return [["From", nodeTitle(page, value.from)], ["To", nodeTitle(page, value.to)], ["Path", titleCase(value.style || "normal")], ...(value.label ? [["Label", value.label]] : []), ...(value.description ? [["Description", value.description]] : [])];
        if (record.type === "group") return [["Nodes", value.nodeIds.map((id) => nodeTitle(page, id)).join(", ")]];
        if (record.type === "section") return [["Blocks", value.blocks.length]];
        if (record.type === "block") return [["Block type", titleCase(value.type)]];
        return [];
      }

      function nodeTitle(page, nodeId) {
        return page.nodes?.find((node) => node.id === nodeId)?.title || nodeId;
      }

      function displayValue(value) {
        if (Array.isArray(value)) return value.join(", ");
        if (value === true) return "Yes";
        if (value === false) return "No";
        return value == null ? "" : String(value);
      }

      function displayPage(context) {
        const page = context.page;
        if (!page || page.type !== "flow" || context.scope !== "review" || context.mode !== "changes") return page;
        const before = context.beforeMap[page.id];
        const after = context.pageMap[page.id];
        if (!before || !after) return page;
        const mergeById = (current, previous) => [
          ...current,
          ...previous.filter((oldItem) => !current.some((item) => item.id === oldItem.id)),
        ];
        return {
          ...after,
          nodes: mergeById(after.nodes || [], before.nodes || []),
          edges: mergeById(after.edges || [], before.edges || []),
          groups: mergeById(after.groups || [], before.groups || []),
        };
      }

      function renderInspectorComment(comment) {
        const editing = runtime.editingCommentId === comment.id;
        const deleting = runtime.deletingCommentId === comment.id;
        return `<article class="comment-item">
          <div class="comment-meta">${statusPill(comment.status)}<span>${escapeHtml(formatDate(comment.createdAt))}</span></div>
          ${editing ? `<textarea class="comment-edit-field" data-comment-id="${escapeHtml(comment.id)}">${escapeHtml(comment.message)}</textarea>` : `<p class="comment-message">${escapeHtml(comment.message)}</p>`}
          ${comment.resolution ? `<p class="comment-resolution">${escapeHtml(comment.resolution)}</p>` : ""}
          ${comment.status === "open" ? `<div class="comment-actions">
            ${editing ? `<button class="quiet-button" data-action="save-comment-edit" data-comment-id="${escapeHtml(comment.id)}">Save</button><button class="quiet-button" data-action="cancel-comment-edit">Cancel</button>` : `<button class="quiet-button" data-action="start-comment-edit" data-comment-id="${escapeHtml(comment.id)}">Edit</button>`}
            <button class="quiet-button danger" data-action="${deleting ? "confirm-comment-delete" : "start-comment-delete"}" data-comment-id="${escapeHtml(comment.id)}">${deleting ? "Confirm delete" : "Delete"}</button>
          </div>` : ""}
        </article>`;
      }

      function renderCommentForm(context, target) {
        return `<section class="inspector-section comment-form"><h3>Add comment</h3>
          <textarea id="new-comment" placeholder="Describe what should change"></textarea>
          <button class="button primary" data-action="add-comment" data-proposal-id="${escapeHtml(context.bundle.proposal.id)}" data-target="${escapeHtml(JSON.stringify(target))}">Add open comment</button>
        </section>`;
      }

      function renderReviewCollection(route) {
        const proposals = (DATA.proposals || []).filter((proposal) => proposalMatchesReviewFilter(proposal, runtime.proposalFilter));
        const selected = proposals.find((proposal) => proposal.id === route.proposalId) || proposals[0] || null;
        return `<section class="view collection-view"><div class="collection-inner">
          <header class="collection-header"><div><h1>Architecture review</h1><p>Review proposed changes before they become implementation targets.</p></div>
            <div class="filters">${proposalFilter("review", "Review")}${proposalFilter("approved", "Approved")}</div>
          </header>
          ${selected ? `<div class="proposal-layout"><div class="proposal-list">${proposals.map((proposal) => renderProposalRow(proposal, selected.id)).join("")}</div>${renderProposalDetail(selected)}</div>` : emptyList("No proposals match this filter.")}
        </div></section>`;
      }

      function proposalMatchesReviewFilter(proposal, filter) {
        return filter === "approved"
          ? proposal.status === "approved"
          : ["under_review", "changes_requested"].includes(proposal.status);
      }

      function proposalFilter(value, label) {
        return `<button class="filter-button ${runtime.proposalFilter === value ? "is-active" : ""}" data-action="proposal-filter" data-filter="${value}">${label}</button>`;
      }

      function proposalStatusPill(proposal) {
        const bundle = reviewBundle(proposal.id);
        return bundle?.stale
          ? `<span class="status-pill stale">Needs rebase</span>`
          : statusPill(proposal.status);
      }

      function renderProposalRow(proposal, selectedId) {
        return `<button class="proposal-row ${proposal.id === selectedId ? "is-active" : ""}" data-action="navigate" data-path="review/${encodeURIComponent(proposal.id)}">
          <div class="proposal-row-head"><span class="proposal-row-title">${escapeHtml(proposal.title)}</span>${proposalStatusPill(proposal)}</div>
          <p>${escapeHtml(proposal.summary)}</p>
        </button>`;
      }

      function renderProposalDetail(proposal) {
        const bundle = reviewBundle(proposal.id);
        if (!bundle) return `<article class="proposal-detail"><h2>${escapeHtml(proposal.title)}</h2><p>${escapeHtml(proposal.summary)}</p><p class="writer-note">Regenerate AgentFlow with this proposal selected to inspect its full diff.</p></article>`;
        if (bundle.recordOnly) return `<article class="proposal-detail">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2>${escapeHtml(proposal.title)}</h2>${proposalStatusPill(proposal)}</div>
          <p>${escapeHtml(proposal.summary)}</p>
          <div class="change-summary">${changeStat(bundle.review?.currentVersion || 0, "Review version")}${bundle.stale ? changeStat(0, "Current diff") : changeStat((bundle.review?.requiredReferences || []).length, "Approved references")}</div>
          <p class="writer-note">${bundle.stale
            ? "This proposal is based on an earlier architecture and cannot be reviewed until it is revised against the current architecture. Its original proposal and comments are retained; no duplicate architecture snapshot is stored."
            : "This proposal has been applied to the current architecture. Its submitted change set, comments, and approval record remain available without retaining a duplicate architecture snapshot."}</p>
        </article>`;
        const pageChanges = Object.entries(bundle.diff.pages || {}).filter(([, change]) => change.status !== "unchanged");
        const counts = { added: 0, modified: 0, removed: 0 };
        pageChanges.forEach(([, change]) => { counts[change.status] = (counts[change.status] || 0) + 1; });
        const firstPage = pageChanges[0]?.[0] || bundle.proposed.pages[0]?.id || bundle.before.pages[0]?.id || "";
        const reviewPath = reviewPageRoute(proposal.id, firstPage);
        return `<article class="proposal-detail">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2>${escapeHtml(proposal.title)}</h2>${proposalStatusPill(proposal)}</div>
          <p>${escapeHtml(proposal.summary)}</p>
          <div class="proposal-actions"><button class="button primary" data-action="navigate" data-path="${escapeHtml(reviewPath)}">Review changes</button><button class="button" data-action="navigate" data-path="comments?status=open">Open comments (${proposal.openComments})</button></div>
          <div class="change-summary">${changeStat(counts.added, "Pages added")}${changeStat(counts.modified, "Pages changed")}${changeStat(counts.removed, "Pages removed")}${changeStat(bundle.review?.currentVersion || 0, "Review version")}</div>
          <div class="change-list">${pageChanges.length ? pageChanges.map(([pageId, change]) => {
            const page = pagesMap(bundle.proposed)[pageId] || pagesMap(bundle.before)[pageId];
            return `<button class="doc-list-item" data-action="navigate" data-path="${escapeHtml(reviewPageRoute(proposal.id, pageId))}"><span class="list-copy"><span class="list-title">${escapeHtml(page?.title || pageId)}</span><code>${escapeHtml(page?.type || "page")}</code></span><span class="change-pill ${change.status}">${change.status}</span></button>`;
          }).join("") : `<div class="empty">No page changes.</div>`}</div>
        </article>`;
      }

      function changeStat(value, label) {
        return `<div class="change-stat"><strong>${value}</strong><span>${label}</span></div>`;
      }

      function renderComments(route) {
        const filter = runtime.commentFilter || route.status || "open";
        const query = (runtime.commentSearch || "").trim().toLowerCase();
        const comments = allComments().filter((comment) => (filter === "all" || comment.status === filter) && (!query || `${comment.message} ${comment.proposalTitle || ""} ${targetLabel(comment.target, comment.proposalId)}`.toLowerCase().includes(query)));
        return `<section class="view collection-view"><div class="collection-inner">
          <header class="collection-header"><div><h1>Comments</h1><p>Review feedback across every architecture proposal.</p></div>
            <div style="display:flex;gap:10px;align-items:center"><label class="search" style="margin:0;width:220px"><input id="comment-search" type="search" value="${escapeHtml(runtime.commentSearch || "")}" placeholder="Search comments" /></label><div class="filters">${commentFilter("open", "Open")}${commentFilter("resolved", "Resolved")}${commentFilter("all", "All")}</div></div>
          </header>
          <div class="comments-list">${comments.length ? comments.map(renderCommentRow).join("") : emptyList("No comments match this view.")}</div>
        </div></section>`;
      }

      function commentFilter(value, label) {
        return `<button class="filter-button ${runtime.commentFilter === value ? "is-active" : ""}" data-action="comment-filter" data-filter="${value}">${label}</button>`;
      }

      function renderCommentRow(comment) {
        return `<article class="comment-row" data-action="open-comment" data-comment-id="${escapeHtml(comment.id)}">
          <div>${statusPill(comment.status)}</div><div><div class="comment-target">${escapeHtml(targetLabel(comment.target, comment.proposalId))}</div><div class="comment-proposal">${escapeHtml(comment.proposalTitle || comment.proposalId)}</div></div>
          <div class="comment-row-message">${escapeHtml(comment.message)}${comment.resolution ? `<div class="comment-resolution">${escapeHtml(comment.resolution)}</div>` : ""}</div>
          <div class="comment-date">${escapeHtml(formatDate(comment.createdAt))}</div>
        </article>`;
      }

      function targetLabel(target, proposalId = null) {
        if (!target) return "Architecture";
        const bundle = proposalId ? reviewBundle(proposalId) : null;
        const snapshots = [bundle?.proposed, bundle?.before, DATA.approved, DATA.implemented].filter(Boolean);
        if (target.kind === "navigation") {
          for (const snapshot of snapshots) {
            const item = flattenNavigation(snapshot.navigation).find((candidate) => candidate.id === target.navigationId);
            if (item) return `Navigation · ${item.title}`;
          }
          return `Navigation · ${target.navigationId || "item"}`;
        }
        let page = null;
        for (const snapshot of snapshots) {
          page = (snapshot.pages || []).find((candidate) => candidate.id === target.pageId);
          if (page) break;
        }
        if (!page) return target.pageId || "Page";
        if (!target.elementType) return page.title;
        const record = selectedRecord(page, { type: target.elementType, id: target.elementId });
        return `${page.title} · ${record.title || titleCase(target.elementType)}`;
      }

      function flowNodeDimensions(node, measuredDimensions = {}) {
        const palette = DATA.nodeTypes[node.type] || {};
        const isDecision = palette.shape === "diamond";
        const minimum = { width: isDecision ? 220 : 208, height: isDecision ? 132 : 82 };
        const measured = measuredDimensions[node.id] || {};
        return {
          width: minimum.width,
          height: Math.max(minimum.height, Math.ceil(Number(measured.height) || 0)),
        };
      }

      function flowLayout(page, measuredDimensions = {}) {
        const byId = Object.fromEntries(page.nodes.map((node) => [node.id, node]));
        const incoming = Object.fromEntries(page.nodes.map((node) => [node.id, 0]));
        const outgoing = Object.fromEntries(page.nodes.map((node) => [node.id, []]));
        for (const edge of page.edges) {
          if (incoming[edge.to] != null) incoming[edge.to] += 1;
          if (outgoing[edge.from]) outgoing[edge.from].push(edge.to);
        }
        const queue = page.nodes.filter((node) => incoming[node.id] === 0).map((node) => node.id);
        const levels = Object.fromEntries(queue.map((id) => [id, 0]));
        const pending = { ...incoming };
        while (queue.length) {
          const id = queue.shift();
          for (const target of outgoing[id] || []) {
            levels[target] = Math.max(levels[target] || 0, (levels[id] || 0) + 1);
            pending[target] -= 1;
            if (pending[target] === 0) queue.push(target);
          }
        }
        for (const node of page.nodes) if (levels[node.id] == null) levels[node.id] = 0;
        const buckets = {};
        for (const node of page.nodes) (buckets[levels[node.id]] ||= []).push(node.id);
        const direction = "down";
        const positions = {};
        const dimensions = Object.fromEntries(page.nodes.map((node) => [node.id, flowNodeDimensions(node, measuredDimensions)]));
        const horizontalGap = 88;
        const verticalGap = 104;
        const padding = 80;
        const rows = Object.entries(buckets).sort((a, b) => Number(a[0]) - Number(b[0])).map(([level, ids]) => {
          const width = ids.reduce((total, id) => total + dimensions[id].width, 0) + Math.max(0, ids.length - 1) * horizontalGap;
          const height = Math.max(0, ...ids.map((id) => dimensions[id].height));
          return { level: Number(level), ids, width, height };
        });
        const contentWidth = Math.max(0, ...rows.map((row) => row.width));
        let y = padding;
        let contentBottom = padding;
        for (const row of rows) {
          let x = padding + (contentWidth - row.width) / 2;
          for (const id of row.ids) {
            positions[id] = { x, y };
            x += dimensions[id].width + horizontalGap;
          }
          contentBottom = y + row.height;
          y = contentBottom + verticalGap;
        }
        return {
          byId,
          positions,
          dimensions,
          worldWidth: Math.max(contentWidth + padding * 2, 500),
          worldHeight: Math.max(contentBottom + padding, 320),
          direction,
        };
      }

      function renderFlowWorld(page, context, selection, layout) {
        const changes = context.diff.pages?.[page.id]?.elements || {};
        const groups = (page.groups || []).map((group) => {
          const boxes = group.nodeIds.map((id) => ({ ...layout.positions[id], ...layout.dimensions[id] })).filter((box) => box.x != null);
          if (!boxes.length) return "";
          const left = Math.min(...boxes.map((box) => box.x)) - 24;
          const top = Math.min(...boxes.map((box) => box.y)) - 30;
          const right = Math.max(...boxes.map((box) => box.x + box.width)) + 24;
          const bottom = Math.max(...boxes.map((box) => box.y + box.height)) + 24;
          return `<div class="flow-group" style="left:${left}px;top:${top}px;width:${right-left}px;height:${bottom-top}px"><span class="flow-group-label">${escapeHtml(group.title)}</span></div>`;
        }).join("");
        const edges = page.edges.map((edge) => renderFlowEdge(edge, layout, selection, changes[`edge:${edge.id}`])).join("");
        const nodes = page.nodes.map((node) => {
          const position = layout.positions[node.id];
          const palette = DATA.nodeTypes[node.type] || { label: titleCase(node.type), shape: "rounded", tone: "stone" };
          const size = layout.dimensions[node.id];
          const change = changes[`node:${node.id}`] || "unchanged";
          return `<button class="flow-node ${selection?.type === "node" && selection.id === node.id ? "is-selected" : ""} ${statusClass(change)}" style="left:${position.x}px;top:${position.y}px;width:${size.width}px;min-height:${size.height}px" data-action="select-element" data-type="node" data-id="${escapeHtml(node.id)}" data-shape="${escapeHtml(palette.shape)}" data-tone="${escapeHtml(palette.tone)}">
            <span class="node-meta"><span class="node-type">${escapeHtml(palette.label)}</span>${renderFlowNodeChange(change)}</span><span class="node-title">${escapeHtml(node.title)}</span>${node.subtitle ? `<span class="node-subtitle">${escapeHtml(node.subtitle)}</span>` : ""}
          </button>`;
        }).join("");
        return `${groups}<svg class="flow-edges" width="${layout.worldWidth}" height="${layout.worldHeight}" viewBox="0 0 ${layout.worldWidth} ${layout.worldHeight}" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98a2b3"></path></marker></defs>${edges}</svg>${nodes}`;
      }

      function renderFlowNodeChange(change) {
        if (!["added", "modified", "removed"].includes(change)) return "";
        return `<span class="node-change ${change}">${escapeHtml(change)}</span>`;
      }

      function renderFlowEdge(edge, layout, selection, change) {
        const source = layout.positions[edge.from];
        const target = layout.positions[edge.to];
        if (!source || !target) return "";
        const sourceSize = layout.dimensions[edge.from];
        const targetSize = layout.dimensions[edge.to];
        let x1, y1, x2, y2, path;
        if (layout.direction === "down") {
          x1 = source.x + sourceSize.width / 2; y1 = source.y + sourceSize.height;
          x2 = target.x + targetSize.width / 2; y2 = target.y;
          const middle = (y1 + y2) / 2;
          path = `M ${x1} ${y1} C ${x1} ${middle}, ${x2} ${middle}, ${x2} ${y2}`;
        } else {
          x1 = source.x + sourceSize.width; y1 = source.y + sourceSize.height / 2;
          x2 = target.x; y2 = target.y + targetSize.height / 2;
          const middle = (x1 + x2) / 2;
          path = `M ${x1} ${y1} C ${middle} ${y1}, ${middle} ${y2}, ${x2} ${y2}`;
        }
        const selected = selection?.type === "edge" && selection.id === edge.id;
        const labelX = (x1 + x2) / 2;
        const labelY = (y1 + y2) / 2 - 7;
        return `<path class="flow-edge-hit" d="${path}" data-action="select-element" data-type="edge" data-id="${escapeHtml(edge.id)}"></path><path class="flow-edge ${escapeHtml(edge.style || "normal")} ${selected ? "is-selected" : ""} ${statusClass(change)}" d="${path}"></path>${edge.label ? `<text class="edge-label" x="${labelX}" y="${labelY}" text-anchor="middle">${escapeHtml(edge.label)}</text>` : ""}`;
      }

      function mountFlow(context, selection) {
        const canvas = document.getElementById("flow-canvas");
        const world = document.getElementById("flow-world");
        if (!canvas || !world || context.page?.type !== "flow") return;
        const page = displayPage(context);
        let layout = flowLayout(page);
        const paintFlow = () => {
          world.style.width = `${layout.worldWidth}px`;
          world.style.height = `${layout.worldHeight}px`;
          world.innerHTML = renderFlowWorld(page, context, selection, layout);
        };
        paintFlow();
        const measuredDimensions = Object.fromEntries([...world.querySelectorAll(".flow-node")].map((node) => [
          node.dataset.id,
          { height: node.offsetHeight },
        ]));
        layout = flowLayout(page, measuredDimensions);
        paintFlow();
        const key = `${context.scope}:${context.mode}:${context.bundle?.proposal?.id || ""}:${context.page.id}`;
        const view = runtime.flowViews[key] || { x: 0, y: 0, scale: 1, fitted: false };
        runtime.flowViews[key] = view;
        canvas._agentflow = { key, view, layout };
        if (!view.fitted) requestAnimationFrame(() => fitFlow(canvas));
        else applyFlowTransform(canvas);

        const pointers = new Map();
        let gesture = null;
        canvas.addEventListener("pointerdown", (event) => {
          if (event.target.closest("button, [data-action]")) return;
          canvas.setPointerCapture(event.pointerId);
          pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (pointers.size === 1) {
            gesture = { type: "pan", startX: event.clientX, startY: event.clientY, x: view.x, y: view.y };
            canvas.classList.add("is-panning");
          } else if (pointers.size === 2) {
            const points = [...pointers.values()];
            gesture = {
              type: "pinch",
              distance: Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y),
              scale: view.scale,
              x: view.x,
              y: view.y,
              midpoint: { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 },
            };
          }
        });
        canvas.addEventListener("pointermove", (event) => {
          if (!pointers.has(event.pointerId)) return;
          pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (pointers.size === 1 && gesture?.type === "pan") {
            view.x = gesture.x + event.clientX - gesture.startX;
            view.y = gesture.y + event.clientY - gesture.startY;
            applyFlowTransform(canvas);
          } else if (pointers.size === 2 && gesture?.type === "pinch") {
            const points = [...pointers.values()];
            const distance = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
            const midpoint = { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 };
            const next = clamp(gesture.scale * distance / Math.max(gesture.distance, 1), 0.25, 2.5);
            const ratio = next / gesture.scale;
            view.x = midpoint.x - (gesture.midpoint.x - gesture.x) * ratio;
            view.y = midpoint.y - (gesture.midpoint.y - gesture.y) * ratio;
            view.scale = next;
            applyFlowTransform(canvas);
          }
        });
        const endPointer = (event) => {
          pointers.delete(event.pointerId);
          if (pointers.size === 1) {
            const point = [...pointers.values()][0];
            gesture = { type: "pan", startX: point.x, startY: point.y, x: view.x, y: view.y };
            canvas.classList.add("is-panning");
          } else if (!pointers.size) {
            gesture = null;
            canvas.classList.remove("is-panning");
          }
        };
        canvas.addEventListener("pointerup", endPointer);
        canvas.addEventListener("pointercancel", endPointer);
        canvas.addEventListener("wheel", (event) => {
          event.preventDefault();
          const rect = canvas.getBoundingClientRect();
          zoomFlow(canvas, Math.exp(-event.deltaY * 0.0015), event.clientX - rect.left, event.clientY - rect.top);
        }, { passive: false });
      }

      function clamp(value, minimum, maximum) { return Math.min(maximum, Math.max(minimum, value)); }

      function applyFlowTransform(canvas) {
        const { view } = canvas._agentflow;
        const world = canvas.querySelector(".flow-world");
        world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
        const label = canvas.querySelector("#zoom-value");
        if (label) label.textContent = `${Math.round(view.scale * 100)}%`;
      }

      function zoomFlow(canvas, factor, anchorX = canvas.clientWidth / 2, anchorY = canvas.clientHeight / 2) {
        if (!canvas?._agentflow) return;
        const view = canvas._agentflow.view;
        const next = clamp(view.scale * factor, 0.25, 2.5);
        const ratio = next / view.scale;
        view.x = anchorX - (anchorX - view.x) * ratio;
        view.y = anchorY - (anchorY - view.y) * ratio;
        view.scale = next;
        view.fitted = true;
        applyFlowTransform(canvas);
      }

      function fitFlow(canvas) {
        if (!canvas?._agentflow) return;
        const { view, layout } = canvas._agentflow;
        const padding = 54;
        view.scale = clamp(Math.min((canvas.clientWidth - padding * 2) / layout.worldWidth, (canvas.clientHeight - padding * 2) / layout.worldHeight, 1), 0.25, 1);
        view.x = (canvas.clientWidth - layout.worldWidth * view.scale) / 2;
        view.y = (canvas.clientHeight - layout.worldHeight * view.scale) / 2;
        view.fitted = true;
        applyFlowTransform(canvas);
      }

      async function writeCommentRequest(request) {
        if (!DATA.commentBridge) throw new Error("The local comment writer is not connected. Regenerate AgentFlow.");
        const response = await fetch(`${DATA.commentBridge.endpoint}/comments`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-AgentFlow-Token": DATA.commentBridge.token },
          body: JSON.stringify(request),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.ok !== true) throw new Error(result.error || "Could not save the comment.");
        return result;
      }

      function randomId(prefix) {
        const bytes = new Uint8Array(10);
        crypto.getRandomValues(bytes);
        return `${prefix}-${[...bytes].map((value) => value.toString(16).padStart(2, "0")).join("")}`;
      }

      function commentRecord(id) {
        return allComments().find((comment) => comment.id === id) || null;
      }

      async function addCommentFromInspector(button) {
        const field = document.getElementById("new-comment");
        const message = field?.value.trim();
        if (!message) { showToast("Write a comment first."); field?.focus(); return; }
        const proposalId = button.dataset.proposalId;
        const bundle = reviewBundle(proposalId);
        const commentId = randomId("comment");
        const request = {
          schemaVersion: DATA.schemaVersion,
          id: randomId("request"),
          operation: "add",
          proposalId,
          proposalVersion: bundle.review.currentVersion,
          commentId,
          target: JSON.parse(button.dataset.target),
          message,
          requestedAt: new Date().toISOString(),
        };
        button.disabled = true;
        try {
          await writeCommentRequest(request);
          runtime.pendingComments.push({
            id: commentId, status: "open", target: request.target, message,
            createdAt: request.requestedAt, proposalVersion: request.proposalVersion,
            proposalId, proposalTitle: bundle.proposal.title, proposalStatus: "changes_requested", pending: true,
          });
          bundle.review.status = "changes_requested";
          showToast("Open comment saved in this project.");
          renderApp();
        } catch (error) {
          button.disabled = false;
          showToast(error.message);
        }
      }

      async function editCommentRequest(commentId) {
        const comment = commentRecord(commentId);
        const field = document.querySelector(`.comment-edit-field[data-comment-id="${CSS.escape(commentId)}"]`);
        const message = field?.value.trim();
        if (!comment || !message) { showToast("Comment cannot be empty."); return; }
        const bundle = reviewBundle(comment.proposalId);
        try {
          await writeCommentRequest({
            schemaVersion: DATA.schemaVersion, id: randomId("request"), operation: "edit",
            proposalId: comment.proposalId, proposalVersion: bundle.review.currentVersion,
            commentId, message, requestedAt: new Date().toISOString(),
          });
          comment.message = message;
          comment.editedAt = new Date().toISOString();
          runtime.editingCommentId = null;
          showToast("Comment updated.");
          renderApp();
        } catch (error) { showToast(error.message); }
      }

      async function deleteCommentRequest(commentId) {
        const comment = commentRecord(commentId);
        if (!comment) return;
        const bundle = reviewBundle(comment.proposalId);
        try {
          await writeCommentRequest({
            schemaVersion: DATA.schemaVersion, id: randomId("request"), operation: "delete",
            proposalId: comment.proposalId, proposalVersion: bundle.review.currentVersion,
            commentId, requestedAt: new Date().toISOString(),
          });
          DATA.comments = (DATA.comments || []).filter((item) => item.id !== commentId);
          runtime.pendingComments = runtime.pendingComments.filter((item) => item.id !== commentId);
          runtime.deletingCommentId = null;
          showToast("Open comment deleted.");
          renderApp();
        } catch (error) { showToast(error.message); }
      }

      function openComment(commentId) {
        const comment = commentRecord(commentId);
        if (!comment) return;
        const bundle = reviewBundle(comment.proposalId);
        const pageId = comment.target?.pageId || bundle?.proposed?.pages?.[0]?.id || bundle?.before?.pages?.[0]?.id || "";
        const target = comment.target?.elementType ? `${comment.target.elementType}:${comment.target.elementId}` : null;
        runtime.inspectorOpen = true;
        navigate(reviewPageRoute(comment.proposalId, pageId, "changes", target));
      }

      function bindView(route) {
        const context = route.view === "architecture"
          ? architectureContext(route)
          : route.view === "review" && route.pageId
            ? reviewContext(route)
            : null;
        if (context?.page?.type === "flow") mountFlow(context, selectionFromRoute(context));
        const search = document.getElementById("architecture-search");
        if (search && context) search.addEventListener("input", (event) => updateArchitectureSearch(context, event.target.value));
        const commentSearch = document.getElementById("comment-search");
        if (commentSearch) commentSearch.addEventListener("input", (event) => {
          const start = event.target.selectionStart;
          const end = event.target.selectionEnd;
          runtime.commentSearch = event.target.value;
          renderApp();
          requestAnimationFrame(() => {
            const next = document.getElementById("comment-search");
            next?.focus();
            if (start != null && end != null) next?.setSelectionRange(start, end);
          });
        });
      }

      function updateArchitectureSearch(context, value) {
        runtime.search = value;
        const tree = document.getElementById("architecture-tree");
        if (tree) tree.innerHTML = renderTree(context);
      }

      app.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        if (action === "navigate") navigate(target.dataset.path);
        else if (action === "toggle-folder") {
          runtime.collapsed[target.dataset.folderId] = !runtime.collapsed[target.dataset.folderId];
          store(`${projectKey}:collapsed`, runtime.collapsed);
          renderApp();
        } else if (action === "toggle-sidebar") { runtime.sidebarOpen = !runtime.sidebarOpen; renderApp(); }
        else if (action === "toggle-inspector") { runtime.inspectorOpen = !runtime.inspectorOpen; renderApp(); }
        else if (action === "select-element") {
          const route = routeFromHash();
          const context = route.view === "review" ? reviewContext(route) : architectureContext(route);
          if (!context) return;
          runtime.inspectorOpen = true;
          navigate(contextPageRoute(context, context.pageId, `${target.dataset.type}:${target.dataset.id}`));
        } else if (action === "proposal-filter") { runtime.proposalFilter = target.dataset.filter; renderApp(); }
        else if (action === "comment-filter") { runtime.commentFilter = target.dataset.filter; navigate(`comments?status=${target.dataset.filter}`); }
        else if (action === "open-comment") openComment(target.dataset.commentId);
        else if (action === "add-comment") addCommentFromInspector(target);
        else if (action === "start-comment-edit") { runtime.editingCommentId = target.dataset.commentId; runtime.deletingCommentId = null; renderApp(); }
        else if (action === "cancel-comment-edit") { runtime.editingCommentId = null; renderApp(); }
        else if (action === "save-comment-edit") editCommentRequest(target.dataset.commentId);
        else if (action === "start-comment-delete") { runtime.deletingCommentId = target.dataset.commentId; runtime.editingCommentId = null; renderApp(); }
        else if (action === "confirm-comment-delete") deleteCommentRequest(target.dataset.commentId);
        else if (action.startsWith("flow-")) {
          const canvas = document.getElementById("flow-canvas");
          if (action === "flow-fit") fitFlow(canvas);
          else zoomFlow(canvas, action === "flow-zoom-in" ? 1.2 : 1 / 1.2);
        }
      });

      window.addEventListener("hashchange", renderApp);
      window.addEventListener("keydown", (event) => {
        if (event.key === "/" && !event.metaKey && !event.ctrlKey && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) {
          event.preventDefault();
          document.getElementById("architecture-search")?.focus();
        }
        if (event.key === "Escape") {
          runtime.sidebarOpen = false;
          runtime.inspectorOpen = false;
          runtime.editingCommentId = null;
          runtime.deletingCommentId = null;
          renderApp();
        }
      });
      renderApp();
