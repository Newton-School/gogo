{% extends "base.html" %}{% block content %}<div class="page-heading"><h1>{{ title }}</h1></div><section class="panel confirmation"><p>Confirm this action on the following records. Permissions and record versions are checked again before execution.</p><form method="post">{% csrf_token %}<input type="hidden" name="action" value="{{ action }}"><input type="hidden" name="_confirmation" value="{{ confirmation }}"><ul>{% for row in rows %}<li>{{ row.label }}<input type="hidden" name="_selected" value="{{ row.id }}"></li>{% endfor %}</ul><button name="_confirm" type="submit">Confirm action</button></form></section>{% endblock %}
