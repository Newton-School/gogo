{% extends "base.html" %}{% block content %}
<div class="page-heading"><h1>{{ title }}</h1><a href="{{ back_url }}">Back</a></div>
<form method="post" class="panel edit-form">{% csrf_token %}<input type="hidden" name="_edit_token" value="{{ edit_token }}">
<div class="form-row"><p class="muted">{{ instruction }}</p></div>{{ form }}
<div class="submit-row"><button type="submit">{{ submit_label }}</button><a href="{{ back_url }}">Cancel</a></div>
</form>{% endblock %}
