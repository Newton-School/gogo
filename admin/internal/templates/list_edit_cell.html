<div class="list-edit-cell">{% if grouped %}<span class="visually-hidden" id="{{ id }}_label">{{ label }} for {{ object_label }}</span>{% else %}<label class="visually-hidden" for="{{ id }}">{{ label }} for {{ object_label }}</label>{% endif %}{{ widget }}<span class="helptext" id="{{ id }}_help">{{ help }}</span><ul class="errorlist" id="{{ id }}_errors">{% for error in errors %}<li>{{ error.Message }}</li>{% endfor %}</ul></div>
