<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} | {{ site_title }}</title><link rel="stylesheet" href="{{ css_url }}"></head>
<body class="login-page"><a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header"><a class="brand" href="{{ prefix }}"><span class="brand-mark" aria-hidden="true">g</span>{{ header }}</a><div class="user-tools"><span>{{ actor }}</span>{% if logout_url %}<form method="post" action="{{ logout_url }}"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}"><button class="logout-button" type="submit">Sign out</button></form>{% endif %}</div></header>
<main id="main" tabindex="-1" class="login-main"><section class="panel login-panel" aria-labelledby="password-title">
<div class="login-intro"><p class="eyebrow">Account security</p><h1 id="password-title">{{ title }}</h1><p class="muted">Enter your current password and choose a new password for your own account.</p></div>
{% if error %}<p class="login-error error-note" role="alert" id="password_error">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
<div class="form-row"><label for="id_old_password">Current password</label><input id="id_old_password" name="old_password" type="password" autocomplete="current-password" required maxlength="4096"{% if error %} aria-describedby="password_error"{% endif %}></div>
<div class="form-row"><label for="id_new_password1">New password</label><input id="id_new_password1" name="new_password1" type="password" autocomplete="new-password" required maxlength="4096"{% if error %} aria-describedby="password_error"{% endif %}></div>
<div class="form-row"><label for="id_new_password2">Confirm new password</label><input id="id_new_password2" name="new_password2" type="password" autocomplete="new-password" required maxlength="4096"{% if error %} aria-describedby="password_error"{% endif %}></div>
<div class="submit-row"><button type="submit">Change password</button><a class="button secondary" href="{{ prefix }}">Back to administration</a></div></form></section><footer>Gogo administration</footer></main></body></html>
