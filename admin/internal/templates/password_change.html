{% extends "account_base.html" %}{% block content %}<div id="content-main">
<p>Enter your current password and choose a new password for your own account.</p>{% if error %}<p class="errornote" role="alert" id="password_error">{{ error }}</p>{% endif %}
<form method="post" novalidate><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}"><fieldset class="module aligned">
<div class="form-row"><div class="flex-container"><label class="required" for="id_old_password">Current password:</label><input id="id_old_password" name="old_password" type="password" autocomplete="current-password" required maxlength="4096"{% if error %} aria-describedby="password_error"{% endif %}></div></div>
<div class="form-row"><div class="flex-container"><label class="required" for="id_new_password1">New password:</label><input id="id_new_password1" name="new_password1" type="password" autocomplete="new-password" required maxlength="4096"{% if error %} aria-describedby="password_error"{% endif %}></div></div>
<div class="form-row"><div class="flex-container"><label class="required" for="id_new_password2">Confirm new password:</label><input id="id_new_password2" name="new_password2" type="password" autocomplete="new-password" required maxlength="4096"{% if error %} aria-describedby="password_error"{% endif %}></div></div>
</fieldset><div class="submit-row"><input type="submit" class="default" value="Change password"><a class="closelink" href="{{ prefix }}">Back to administration</a></div></form></div>{% endblock %}
