{% for inline in inlines %}<section class="inline-group" aria-label="{{ inline.label }}"><h2>{{ inline.label }}</h2><input type="hidden" name="{{ inline.name }}-TOTAL_FORMS" value="{{ inline.total }}"><input type="hidden" name="{{ inline.name }}-INITIAL_FORMS" value="{{ inline.initial }}">{% if inline.errors %}<ul class="errorlist" role="alert">{% for error in inline.errors %}<li>{{ error.Message }}</li>{% endfor %}</ul>{% endif %}{% for row in inline.rows %}<fieldset class="inline-row"><legend>{{ row.label }}</legend><input type="hidden" name="{{ row.prefix }}-_id" value="{{ row.id }}"><input type="hidden" name="{{ row.prefix }}-_edit_token" value="{{ row.token }}">{{ row.form }}{% if row.can_delete %}<label class="inline-delete"><input type="checkbox" name="{{ row.prefix }}-DELETE" value="true"> Delete this row</label>{% endif %}</fieldset>{% endfor %}</section>{% endfor %}
