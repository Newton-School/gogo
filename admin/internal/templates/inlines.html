{% for inline in inlines %}<div class="js-inline-admin-formset inline-group" aria-label="{{ inline.label }}"><fieldset class="module"><h2 class="inline-heading">{{ inline.label }}</h2>
<input type="hidden" name="{{ inline.name }}-TOTAL_FORMS" value="{{ inline.total }}"><input type="hidden" name="{{ inline.name }}-INITIAL_FORMS" value="{{ inline.initial }}">
{% if inline.errors %}<ul class="errorlist" role="alert">{% for error in inline.errors %}<li>{{ error.Message }}</li>{% endfor %}</ul>{% endif %}
{% for row in inline.rows %}<div class="inline-related"><h3><b>{{ row.label }}</b>{% if row.can_delete %}<span class="delete"><label><input type="checkbox" name="{{ row.prefix }}-DELETE" value="true"> Delete</label></span>{% endif %}</h3>
<input type="hidden" name="{{ row.prefix }}-_id" value="{{ row.id }}"><input type="hidden" name="{{ row.prefix }}-_edit_token" value="{{ row.token }}">{{ row.form }}</div>{% endfor %}</fieldset></div>{% endfor %}
