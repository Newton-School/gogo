{% extends "base.html" %}{% block content %}<div class="page-heading"><h1>{{ title }}</h1></div><section class="panel table-scroll"><table><thead><tr><th scope="col">Date</th><th scope="col">Actor</th><th scope="col">Action</th><th scope="col">Object</th></tr></thead><tbody>{% for entry in entries %}<tr><td>{{ entry.at }}</td><td>{{ entry.actor }}</td><td>{{ entry.action }}</td><td>{{ entry.label }}</td></tr>{% empty %}<tr><td colspan="4" class="empty-state">No history available.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
